const scene=new T.Scene();scene.background=new T.Color('#253039');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.NeutralToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
